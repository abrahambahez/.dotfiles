name: Common projects
matches:

  - trigger: ":sc"
    replace: "SIUCAM"

  - trigger: ":flc"
    replace: "FLACSO"

  - trigger: ":fmc"
    replace: "módulo colaborativo"

  # force_clipboard: multilínea
  - trigger: ":sbs"
    replace: "Sergio Barrera\nProduct Manager — Silia"
    force_clipboard: true

  # word: true evita expansión accidental dentro de otras palabras
  - trigger: "asap"
    replace: "lo más pronto posible"
    word: true

  # force_clipboard: multilínea
  - trigger: ":seg"
    replace: "Hola equipo, espero que estén muy bien,\nDando seguimiento a\nQuedo atento a su respuesta; gracias y saludos"
    force_clipboard: true

  - trigger: ":cr"
    replace: "Creai"

  - trigger: ":sl"
    replace: "Silia"

  - trigger: ":avgs"
    replace: "Asistente virtual General de Seguros"
    force_clipboard: true
